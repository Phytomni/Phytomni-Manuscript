name: reproduce-figures
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Public contracts and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12.13'
      - name: Prepare locked Python environment
        run: |
          uv lock --check
          uv sync --frozen
      - name: Validate public inputs and run Python tests
        run: |
          source .venv/bin/activate
          ./reproduce.sh validate
          python -m pytest tests/ -m 'not r_runtime' -q

  figures:
    name: Locked reference environment and fresh figures
    needs: checks
    runs-on: ubuntu-24.04
    env:
      R_PROFILE_USER: /dev/null
      RENV_PROJECT: ${{ github.workspace }}
      R_LIBS_USER: ${{ github.workspace }}/renv/library/R-4.3/x86_64-pc-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12.13'
      - name: Prepare locked Python environment
        run: |
          uv lock --check
          uv sync --frozen
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Install R build and font prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libjpeg-dev libpng-dev libtiff-dev libzmq3-dev libicu-dev \
            pandoc fontconfig fonts-dejavu-core
      - name: Restore and verify exact R package identities
        run: |
          Rscript --vanilla - <<'RS'
          source("renv/activate.R")
          library_path <- Sys.getenv("R_LIBS_USER")
          renv::restore(library=library_path, lockfile="renv.lock", strict=TRUE, prompt=FALSE)
          locked <- renv::lockfile_read("renv.lock")
          stopifnot(as.character(getRversion()) == locked$R$Version)
          for (name in names(locked$Packages)) {
            actual <- packageDescription(name, lib.loc=library_path)
            stopifnot(identical(actual$Version, locked$Packages[[name]]$Version))
          }
          stopifnot(identical(packageDescription("ggradar", lib.loc=library_path)$RemoteSha,
                              locked$Packages$ggradar$RemoteSha))
          RS
          fc-match Arial
          fc-match 'DejaVu Sans'
      - name: Check actual R runtime and reproduce all public figures
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -m r_runtime -q
          ./reproduce.sh run --timeout 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-figures
          path: logs/reproduce/*/shareable/artifacts/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figure-run-evidence
          path: |
            logs/reproduce/*/shareable/summary.json
            logs/reproduce/*/shareable/targets/*.log
          if-no-files-found: warn
